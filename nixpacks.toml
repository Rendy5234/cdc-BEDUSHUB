# =============================================================================
# Konfigurasi build Nixpacks untuk deploy CDC BEDUSHUB di Railway.
#
# Catatan:
# - Versi PHP (8.2) diambil otomatis dari composer.json ("php": "^8.2").
# - Ekstensi PHP (pdo_sqlite, sqlite3, gd, intl, mbstring, dsb.) diambil otomatis
#   dari entri "ext-*" pada composer.json (cara resmi Nixpacks).
# - Versi Node (20) diambil dari file .nvmrc di root.
# - Nixpacks otomatis menjalankan: composer install --ignore-platform-reqs,
#   npm install, npm run build, serta menyetel NIXPACKS_PHP_ROOT_DIR=/app/public.
# - Kita hanya menambah perintah kecil: membuat file SQLite saat build.
# =============================================================================

[phases.setup]
nixPkgs = ["...", "unzip"]

[phases.build]
cmds = [
    "npm run build",
    # Siapkan file database SQLite kosong agar artisan bisa dijalankan saat start.
    "mkdir -p database storage/app/public && touch database/database.sqlite",
]

[variables]
PHP_CLI_SERVER_WORKERS = "4"

# Runtime memakai `php artisan serve` (lihat start.sh) supaya boot command
# (migrate:fresh --seed, storage:link) berjalan sebelum web server dihidupkan.
# Ini menggantikan start default Nixpacks (nginx) yang tidak menjalankan seeder.
[start]
cmd = "bash start.sh"